<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F26">
<title>Amit &amp; Priyanka — 04 December 2026 | Groom's Wedding Invitation</title>
<meta name="description" content="An invitation to the wedding of Amit Yadav &amp; Priyanka Yadav, 04 December 2026, Lucknow. Walk in.">

<link rel="icon" href="assets/images/logo-500.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400..500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/walk.css">
<script src="assets/js/groom-data.js"></script>
</head>
<body>

<a class="skip" href="#details" id="skip">Skip the walk and read the invitation</a>
<div class="backdrop" aria-hidden="true"><canvas id="blur" width="24" height="42"></canvas></div>

<main>
  <section class="walk" id="walk" aria-label="A walk through the wedding">
    <div class="stage" id="stage">
      <canvas class="film" id="film" aria-hidden="true"></canvas>
      <div class="copy" id="copy"></div>
      <header class="bar top" id="topBar">
        <button class="mono" id="mono" type="button"></button>
        <div class="bar-end">
          <button class="pill" id="langBtn" type="button"></button>
          <button class="pill icon" id="soundBtn" type="button" aria-pressed="false" aria-label="Play music"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
          <button class="pill" id="detailsBtn" type="button"></button>
        </div>
      </header>
      <footer class="bar bottom" id="bottomBar">
        <p class="where" aria-live="polite"><i id="whereN"></i><span id="whereName"></span></p>
        <button class="next" id="nextBtn" type="button"><span id="nextLabel"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <div class="track" aria-hidden="true"><i id="progress"></i><span id="ticks"></span></div>
      </footer>
      <div class="loading" id="loading" aria-hidden="true"><i></i></div>
    </div>
  </section>
</main>

<dialog class="sheet" id="details" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <p class="sheet-title" id="sheetTitle" tabindex="-1" autofocus></p>
    <button class="close" id="closeBtn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<audio id="music" preload="none" loop></audio>
<script src="assets/js/walk.js"></script>
</body>
</html>
